name: footballay-dev

services:
  redis:
    image: redis:7.2.4-alpine
    container_name: footballay-dev-redis
    command: redis-server --requirepass 1234 --port 6379 --loglevel notice
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.1
    container_name: footballay-dev-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9091"
      KAFKA_LISTENERS: "CONTROLLER://:9091,HOST://:9092,DOCKER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9092,DOCKER://kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.2.1
    container_name: footballay-dev-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      set -e;
      echo 'Creating Kafka topics...';

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic football-data-raw-collected --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic football-data-quality-result --partitions 1 --replication-factor 1;

      echo 'Kafka topics:';
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --list;
      "
    restart: "no"

  mongodb:
    image: mongo:7.0
    container_name: footballay-dev-mongodb
    environment:
      MONGO_INITDB_DATABASE: footballay
      TZ: Asia/Seoul
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    container_name: footballay-dev-seaweedfs
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: seaweedfsadmin
      AWS_SECRET_ACCESS_KEY: seaweedfsadmin
      S3_BUCKET: footballay-data-quality-raw-local
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)\" = 403"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17.4
    container_name: footballay-dev-postgres
    environment:
      POSTGRES_DB: footballay_core
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev1234
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
      - ./logs/postgres:/var/log/postgresql
    command: >
      postgres -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_filename='postgresql-%Y-%m-%d_%H%M%S.log'
      -c log_rotation_age=1d
      -c log_rotation_size=100MB
      -c log_truncate_on_rotation=on
      -c log_destination=stderr
      -c log_line_prefix='%m [%p] %q%u@%d '
      -c client_min_messages=notice
      -c log_statement=ddl
      -c log_min_duration_statement=300ms
      -c log_lock_waits=on
      -c deadlock_timeout=1s
      -c log_temp_files=0
      -c log_checkpoints=on
      -c log_autovacuum_min_duration=0
      -c shared_preload_libraries='pg_stat_statements,auto_explain'
      -c pg_stat_statements.track=all
      -c auto_explain.log_min_duration=200ms
      -c auto_explain.log_analyze=on
      -c auto_explain.log_buffers=on
      -c auto_explain.log_timing=on
      -c auto_explain.log_nested_statements=on
      -c auto_explain.sample_rate=1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  mongodb_data:
    driver: local
  seaweedfs_data:
    driver: local
